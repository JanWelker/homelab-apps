---
# Seeded by `make bao-secrets` in the platform repository. docs/dependency-track.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dependency-track-config
  namespace: dependency-track
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: dependency-track-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: kek
      remoteRef: {key: dependency-track/config, property: kek}
    - secretKey: oidc-client-id
      remoteRef: {key: dependency-track/config, property: oidc-client-id}
---
# Its own path: Dependency-Track issues the key after its first start, so it
# is written later than the rest. docs/dependency-track.md#sbom-upload
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sbom-upload
  namespace: dependency-track
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: sbom-upload
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef: {key: dependency-track/sbom-upload, property: api-key}
