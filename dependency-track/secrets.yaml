---
# kv/dependency-track/config is generated by the PushSecret at the end of this
# file; sbom-upload by `make bao-secrets` in the platform repository.
# docs/dependency-track.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dependency-track-config
  namespace: dependency-track
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: dependency-track-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: kek
      remoteRef: {key: dependency-track/config, property: kek}
    - secretKey: oidc-client-id
      remoteRef: {key: dependency-track/config, property: oidc-client-id}
---
# Its own path: Dependency-Track issues the key after its first start, so it
# is written later than the rest. docs/dependency-track.md#sbom-upload
#
# Sync wave 1, after the application rather than with the other secrets: this
# is the one secret here that only a running Dependency-Track can produce, and
# External Secrets fails an ExternalSecret whose path does not exist. At an
# earlier wave that failure stops the sync before the Deployment that issues
# the key is ever applied.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sbom-upload
  namespace: dependency-track
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: sbom-upload
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef: {key: dependency-track/sbom-upload, property: api-key}
---
# Written once, never overwritten. The platform repository's
# docs/platform/openbao.md#generated-secrets
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: dependency-track-config
  namespace: dependency-track
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 32
  symbols: 0
  allowRepeat: true
  secretKeys:
    - kek
    - oidc-client-id
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: dependency-track-config
  namespace: dependency-track
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: dependency-track-config
  template:
    engineVersion: v2
    data:
      kek: "{{ .kek | b64enc }}"
  data:
    - match: {secretKey: kek, remoteRef: {remoteKey: dependency-track/config, property: kek}}
    - match: {secretKey: oidc-client-id, remoteRef: {remoteKey: dependency-track/config, property: oidc-client-id}}
