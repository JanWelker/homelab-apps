---
# infra-gateway, not apps-gateway: LAN and VPN only. docs/dependency-track.md#configuration
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dependency-track
  namespace: dependency-track
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: infra-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "sbom.infra.k8s.wlkr.ch"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: SAMEORIGIN
      backendRefs:
        - group: ""
          kind: Service
          name: dependency-track-api-server
          port: 8080
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: SAMEORIGIN
      backendRefs:
        - group: ""
          kind: Service
          name: dependency-track-frontend
          port: 8080
          weight: 1
