---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dependency-track-db
  namespace: dependency-track
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  # No shutdown waits on the app's connection pool; see docs/conventions.md
  smartShutdownTimeout: 15
  # One instance: the -primary PDB would refuse every drain; see docs/conventions.md
  enablePDB: false

  imageName: ghcr.io/cloudnative-pg/postgresql:19.0-standard-trixie@sha256:6f17393bf934a41fec47439306a17e087c5c2f419ddd5bf4b8dc0241da4bceb0

  storage:
    size: 10Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: dtrack
      owner: dtrack

  postgresql:
    parameters:
      # No node reserves huge pages, and SELinux denies container_t the probe
      huge_pages: "off"
      shared_buffers: 256MB
      jit: "off"
      wal_compression: lz4
      default_toast_compression: lz4

  # Request at the measured median, limit at 2.5x the peak; see docs/dependency-track.md
  resources:
    requests:
      cpu: 100m
      memory: 640Mi
    limits:
      memory: 2304Mi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: dependency-track-db
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: dependency-track-db-metrics
  namespace: dependency-track
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: dependency-track-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
