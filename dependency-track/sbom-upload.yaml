---
# Trivy Operator already writes one CycloneDX SbomReport per container; this
# job hands every one of them to Dependency-Track once a night. The
# ClusterRole that lets the ServiceAccount list them is the platform's:
# payload/platform/trivy-operator/sbom-readers.yaml in the homelab
# repository. docs/dependency-track.md#sbom-upload
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sbom-upload
  namespace: dependency-track
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sbom-upload
  namespace: dependency-track
data:
  upload.py: |
    """Upload every Trivy Operator SbomReport to Dependency-Track.

    One project per image, named after the image reference without its
    tag and versioned by the tag, so the version history of a project is
    the history of Renovate's bumps. An image is uploaded once however
    many namespaces run it; the namespaces become tags on the project.

    A report outlives its workload: a ReplicaSet scaled to zero keeps its
    SbomReport until it is garbage-collected. Those are skipped, so the
    portfolio is what runs, and the highest running version is the latest.

    Afterwards the findings named in false-positives.json are marked as
    such and suppressed. An analysis belongs to one project version, so it
    is made again for every new tag, which is why it is the job's to make.

    Last, a project this job created and did not upload tonight is marked
    inactive: the image no longer runs. Dependency-Track's retention only
    ever deletes inactive projects, and nothing else knows which those are.
    """
    import base64
    import json
    import os
    import re
    import ssl
    import sys
    import urllib.error
    import urllib.parse
    import urllib.request

    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    API = (
        f"https://{os.environ['KUBERNETES_SERVICE_HOST']}"
        f":{os.environ['KUBERNETES_SERVICE_PORT']}"
    )
    GROUP = "/apis/aquasecurity.github.io/v1alpha1"
    DTRACK = os.environ["DTRACK_URL"]
    API_KEY = os.environ.get("DTRACK_API_KEY", "")
    RULES = os.path.join(os.path.dirname(os.path.abspath(__file__)), "false-positives.json")


    def pages(path, limit):
        """Every object of one kind in the cluster, one page at a time."""
        with open(f"{SA}/token", encoding="utf-8") as handle:
            headers = {"Authorization": f"Bearer {handle.read()}"}
        context = ssl.create_default_context(cafile=f"{SA}/ca.crt")
        cont = ""
        while True:
            query = urllib.parse.urlencode({"limit": limit, "continue": cont})
            request = urllib.request.Request(f"{API}{path}?{query}", headers=headers)
            with urllib.request.urlopen(request, context=context) as response:
                page = json.load(response)
            yield from page["items"]
            cont = page["metadata"].get("continue", "")
            if not cont:
                return


    def reports():
        """Every SbomReport, as the whole custom resource.

        `item["report"]` is the operator's report, and the CycloneDX
        document is `item["report"]["components"]`.
        """
        return pages(f"{GROUP}/sbomreports", 20)


    def idle_replicasets():
        """(namespace, name) of every ReplicaSet scaled to zero.

        None when the list is refused, which is the platform's grant not
        being there yet: the job then uploads every report, as it did
        before it could tell.
        """
        try:
            return {
                (item["metadata"]["namespace"], item["metadata"]["name"])
                for item in pages("/apis/apps/v1/replicasets", 200)
                if not item["spec"].get("replicas")
            }
        except urllib.error.HTTPError as error:
            if error.code != 403:
                raise
            print("may not list ReplicaSets: superseded revisions are uploaded too")
            return None


    def owner(item):
        """(kind, namespace, name) of the workload a report was written for."""
        labels = item["metadata"].get("labels", {})
        return (
            labels.get("trivy-operator.resource.kind", ""),
            item["metadata"]["namespace"],
            labels.get("trivy-operator.resource.name", ""),
        )


    def ordered(version):
        """A sort key that puts v1.10.0 after v1.9.0."""
        return [
            (0, int(part), "") if part.isdigit() else (1, 0, part)
            for part in re.findall(r"\d+|[^\d]+", version)
        ]


    def project(item):
        """(name, version) for an image: the reference without its tag, and the tag.

        The BOM's metadata component carries the full reference; the
        report's own artifact fields put the reference in `tag` when the
        image was pinned by digest, so they are only the fallback.
        """
        artifact = item["report"]["artifact"]
        metadata = item["report"]["components"].get("metadata", {})
        reference = metadata.get("component", {}).get("name") or artifact["repository"]
        reference, _, digest = reference.partition("@")
        name, tag = reference, ""
        if ":" in reference.rsplit("/", 1)[-1]:
            name, _, tag = reference.rpartition(":")
        return name, tag or (digest or artifact.get("digest", ""))[:19]


    def upload(name, version, namespaces, bom, latest):
        body = json.dumps({
            "projectName": name,
            "projectVersion": version,
            "projectTags": [{"name": f"namespace:{ns}"} for ns in sorted(namespaces)],
            "autoCreate": True,
            "isLatest": latest,
            "isActive": True,
            "bom": base64.b64encode(json.dumps(bom).encode()).decode(),
        }).encode()
        request = urllib.request.Request(
            f"{DTRACK}/api/v1/bom", data=body, method="PUT",
            headers={"Content-Type": "application/json", "X-Api-Key": API_KEY},
        )
        with urllib.request.urlopen(request, timeout=120) as response:
            return response.status


    def dtrack(method, path, body=None):
        request = urllib.request.Request(
            f"{DTRACK}/api/v1/{path}",
            data=None if body is None else json.dumps(body).encode(),
            method=method,
            headers={"Content-Type": "application/json", "X-Api-Key": API_KEY},
        )
        with urllib.request.urlopen(request, timeout=120) as response:
            return json.load(response)


    def findings(rule):
        """(project, component, vulnerability) UUIDs a rule applies to.

        A suppressed finding is not listed, so a rule that has been applied
        matches nothing the next night.
        """
        name = urllib.parse.quote(rule["project"], safe="")
        for known in dtrack("GET", f"project?name={name}&pageSize=500"):
            if known["name"] != rule["project"]:
                continue
            for entry in dtrack("GET", f"vulnerability/project/{known['uuid']}?pageSize=5000"):
                if entry["vulnId"] != rule["vulnerability"]:
                    continue
                for component in entry.get("components", []):
                    if (component.get("purl") or "").startswith(rule["component"] + "@"):
                        yield known, component, entry


    def suppress():
        """Mark what false-positives.json names. Returns how many it could not."""
        with open(RULES, encoding="utf-8") as handle:
            rules = json.load(handle)
        marked = 0
        for rule in rules:
            try:
                for known, component, entry in findings(rule):
                    dtrack("PUT", "analysis", {
                        "project": known["uuid"],
                        "component": component["uuid"],
                        "vulnerability": entry["uuid"],
                        "analysisState": "FALSE_POSITIVE",
                        "analysisDetails": rule["details"],
                        "suppressed": True,
                    })
                    marked += 1
                    print(f"SUPPRESSED {rule['vulnerability']} in {known['name']}:{known['version']}")
            except urllib.error.HTTPError as error:
                # Not a failure: the uploads are done, and a job that fails
                # nightly until someone grants a permission is only noise.
                if error.code == 403:
                    print("may not record an analysis: the team lacks VULNERABILITY_ANALYSIS_UPDATE")
                    return 0, marked
                print(f"FAILED {rule['vulnerability']} HTTP {error.code}")
                return len(rules), marked
            except (urllib.error.URLError, TimeoutError) as error:
                print(f"FAILED {rule['vulnerability']} {error}")
                return len(rules), marked
        return 0, marked


    def retire(uploaded):
        """Mark inactive what no longer runs. Returns how many it could not.

        Only projects carrying a namespace: tag, which is this job's mark;
        one created by hand is not the job's to retire.
        """
        retired = 0
        page = 1
        stale = []
        while True:
            batch = dtrack("GET", f"project?excludeInactive=true&pageSize=100&pageNumber={page}")
            stale += [
                known for known in batch
                if (known["name"], known.get("version", "")) not in uploaded
                and any(tag["name"].startswith("namespace:") for tag in known.get("tags", []))
            ]
            if len(batch) < 100:
                break
            page += 1
        for known in stale:
            try:
                dtrack("PATCH", f"project/{known['uuid']}", {"active": False})
            except urllib.error.HTTPError as error:
                if error.code == 403:
                    print("may not retire a project: the team lacks PORTFOLIO_MANAGEMENT_UPDATE")
                    return 0, retired
                print(f"FAILED to retire {known['name']}:{known['version']} HTTP {error.code}")
                return len(stale) - retired, retired
            retired += 1
            print(f"RETIRED {known['name']}:{known['version']}")
        return 0, retired


    def main():
        if not API_KEY:
            print("no API key yet: seed kv/dependency-track/sbom-upload, see docs/dependency-track.md")
            return 1
        images = {}
        skipped = 0
        superseded = 0
        idle = idle_replicasets() or set()
        for item in reports():
            kind, namespace, name = owner(item)
            if kind == "ReplicaSet" and (namespace, name) in idle:
                superseded += 1
                continue
            # A report still being written has no document yet. One of those
            # is not a reason to abandon the other few hundred.
            if "components" not in item.get("report", {}):
                skipped += 1
                print(f"SKIPPED {item['metadata']['namespace']}/{item['metadata']['name']}: no BOM in the report")
                continue
            artifact = item["report"]["artifact"]
            key = artifact.get("digest") or f"{artifact['repository']}:{artifact.get('tag')}"
            entry = images.setdefault(key, {"item": item, "namespaces": set()})
            entry["namespaces"].add(item["metadata"]["namespace"])
        failed = 0
        # One tag can be two digests, a CronJob that has not run since the
        # bump next to one that has. They are one project version, so they
        # are one upload, tagged with every namespace that runs either.
        projects = {}
        for entry in images.values():
            known = projects.setdefault(project(entry["item"]), entry)
            known["namespaces"] |= entry["namespaces"]
        newest = {}
        for name, version in projects:
            if name not in newest or ordered(version) > ordered(newest[name]):
                newest[name] = version
        for (name, version), entry in sorted(projects.items()):
            bom = entry["item"]["report"]["components"]
            try:
                upload(name, version, entry["namespaces"], bom, version == newest[name])
            except urllib.error.HTTPError as error:
                failed += 1
                detail = error.read().decode(errors="replace")[:200]
                print(f"FAILED {name}:{version} HTTP {error.code} {detail}")
            except (urllib.error.URLError, TimeoutError) as error:
                failed += 1
                print(f"FAILED {name}:{version} {error}")
        print(
            f"{len(projects)} images, {failed} failed, {skipped} reports skipped, "
            f"{superseded} from superseded revisions"
        )
        unmarked, marked = suppress()
        print(f"{marked} false positives suppressed, {unmarked} rules not applied")
        # Only after a night in which every upload went through: a run that
        # found no reports would otherwise retire the whole portfolio.
        kept = 0
        if projects and not failed and not skipped:
            try:
                kept, retired = retire(set(projects))
                print(f"{retired} projects retired, {kept} not")
            except (urllib.error.URLError, TimeoutError) as error:
                kept = 1
                print(f"FAILED to retire {error}")
        return 1 if failed or unmarked or kept else 0


    if __name__ == "__main__":
        sys.exit(main())
  # Findings that are not findings. Why each one: docs/dependency-track.md#false-positives
  false-positives.json: |
    [
      {
        "project": "docker.io/library/nextcloud",
        "vulnerability": "MAL-2022-3033",
        "component": "pkg:npm/files_pdfviewer",
        "details": "Nextcloud's own files_pdfviewer app under apps/, which shares its name with an unrelated package on npm."
      },
      {
        "project": "docker.io/library/nextcloud",
        "vulnerability": "MAL-2022-3056",
        "component": "pkg:npm/firstrunwizard",
        "details": "Nextcloud's own firstrunwizard app under apps/, which shares its name with an unrelated package on npm."
      }
    ]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sbom-upload
  namespace: dependency-track
spec:
  # After Trivy's overnight rebuild of the reports, before the platform's
  # findings-history run reads them at 06:30.
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            # Selected by the network policy; job-name alone is not stable.
            app.kubernetes.io/name: sbom-upload
        spec:
          serviceAccountName: sbom-upload
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sbom-upload
              image: docker.io/library/python:3.14-slim@sha256:f85c5697265c178cc6887276c55fe16cf3d14ca35c3df6a5eab3b360534a55d2
              command: ["python3", "/scripts/upload.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: DTRACK_URL
                  value: http://dependency-track-api-server:8080
                # Optional, so the pod starts and says what is missing
                # instead of hanging in CreateContainerConfigError, which
                # a Forbid CronJob never recovers from.
                - name: DTRACK_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sbom-upload
                      key: api-key
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: sbom-upload
