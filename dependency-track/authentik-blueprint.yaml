---
# Lands in the authentik namespace; the key must end in .yaml. docs/dependency-track.md#oidc
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-dependency-track
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  dependency-track.yaml: |
    version: 1
    metadata:
      name: homelab-dependency-track
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: dependency-track-provider
        identifiers:
          name: dependency-track
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          # The frontend is a browser application with no place for a
          # secret: authorization code with PKCE.
          client_type: public
          grant_types:
            - authorization_code
            - refresh_token
          client_id: !Env DEPENDENCY_TRACK_CLIENT_ID
          redirect_uris:
            - matching_mode: strict
              url: https://sbom.k8s.wlkr.ch/static/oidc-callback.html
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: dependency-track
        attrs:
          name: Dependency-Track
          provider: !KeyOf dependency-track-provider
          meta_launch_url: https://sbom.k8s.wlkr.ch
          meta_description: Software bill of materials for every image the cluster runs
