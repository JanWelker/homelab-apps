[project]
name = "homelab-apps"
version = "0.1.0"
description = "Workloads running on the Flatcar homelab cluster"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "zensical>=0.1.2",
    "yamllint>=1.37.1",
    "pre-commit>=4.5.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.6",
    "pytest>=9.2.0",
]

[tool.uv]
# Lock only releases at least 3 days old, the minimumReleaseAge of the shared
# Renovate preset. Without it uv locks a newer release than the one Renovate
# proposes, and Renovate rejects the lock file as an artifact failure.
exclude-newer = "3 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
strict = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "SIM", "RUF"]
ignore = [
    "PLR2004", # a size threshold or a port number reads better inline than as a named constant
]
