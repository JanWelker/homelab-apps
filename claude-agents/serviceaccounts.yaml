# The platform repository binds these to the claude-agent-read and
# claude-agent-write ClusterRoles. A session opts in to the token with
# kubernetes.access in its chart values: docs/claude-agents.md#configuration
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-reader
  namespace: claude-agents
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-writer
  namespace: claude-agents
automountServiceAccountToken: false
