---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: advent-wollbi-db
  namespace: advent-wollbi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  # One instance: the -primary PDB would refuse every drain; see docs/conventions.md
  enablePDB: false

  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:5a5dfbde88d5909fd4938189c141f53fb153f53c519f14907dce9e7c04baa153

  storage:
    size: 2Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: payload
      owner: payload

  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "20"

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: advent-wollbi-db

  monitoring:
    enablePodMonitor: true
