---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: advent-wollbi-db
  namespace: advent-wollbi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Two instances so a drain is a switchover of seconds, not the site down
  # for the move; see docs/advent-wollbi.md#configuration
  instances: 2
  # A spec change promotes a replica first, and no shutdown waits on the
  # app's connection pool; see docs/conventions.md
  primaryUpdateMethod: switchover
  smartShutdownTimeout: 15
  # The operator's anti-affinity is a preference the scheduler outweighs on
  # unequal nodes; this keeps the two apart.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          cnpg.io/cluster: advent-wollbi-db
          cnpg.io/podRole: instance

  imageName: ghcr.io/cloudnative-pg/postgresql:19.0-standard-trixie@sha256:6f17393bf934a41fec47439306a17e087c5c2f419ddd5bf4b8dc0241da4bceb0

  storage:
    size: 2Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: payload
      owner: payload

  postgresql:
    parameters:
      # No node reserves huge pages, and SELinux denies container_t the probe
      huge_pages: "off"
      shared_buffers: 64MB
      max_connections: "20"

  resources:
    requests:
      cpu: 50m
      memory: 160Mi
    limits:
      memory: 512Mi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: advent-wollbi-db
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: advent-wollbi-db-metrics
  namespace: advent-wollbi
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: advent-wollbi-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
