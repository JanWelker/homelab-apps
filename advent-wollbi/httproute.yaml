---
# The site is public -- it is an invitation to the neighbours -- so / reaches
# the app directly; /admin goes through the Authentik outpost, in front of
# Payload's own login. The outpost completes the login on this hostname under
# /outpost.goauthentik.io, so that prefix must reach it too. A longer path
# prefix wins in Gateway API, so the order of these rules does not matter.
# docs/advent-wollbi.md#configuration
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: advent-wollbi
  namespace: advent-wollbi
spec:
  parentRefs:
    - name: apps-gateway
      namespace: kube-system
      sectionName: https-wollbi
  hostnames:
    - "advent.wollbi.ch"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /admin
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: advent-wollbi
          port: 3000
