---
# The site is public -- it is an invitation to the neighbours -- so / reaches
# the app directly. /admin and Payload's API behind it go through the
# Authentik outpost, in front of Payload's own login; only the uploaded files
# the pages link to stay public. The outpost completes the login on this
# hostname under /outpost.goauthentik.io, so that prefix must reach it too.
# /seed never reaches the app through the Gateway: the seed hook calls the
# Service. A longer path prefix wins in Gateway API, so the order of these
# rules does not matter.
# docs/advent-wollbi.md#configuration
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: advent-wollbi
  namespace: advent-wollbi
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: apps-gateway
      namespace: kube-system
      sectionName: https-wollbi
  hostnames:
    - "advent.wollbi.ch"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /admin
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /seed
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /api/media/file
      backendRefs:
        - name: advent-wollbi
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: advent-wollbi
          port: 3000
