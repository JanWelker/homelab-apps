---
# The site is public -- it is an invitation to the neighbours -- so every path
# reaches the app, /admin included: Payload signs editors in through Authentik
# itself. /seed never reaches the app through the Gateway: the seed hook calls
# the Service. A longer path prefix wins in Gateway API, so the order of these
# rules does not matter.
# The backendRefs spell out the CRD defaults: beside the redirect-only /seed
# rule, Argo CD otherwise reports the route OutOfSync forever.
# docs/advent-wollbi.md#configuration
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: advent-wollbi
  namespace: advent-wollbi
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: apps-gateway
      namespace: kube-system
      sectionName: https-wollbi
  hostnames:
    - "advent.wollbi.ch"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /seed
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: advent-wollbi
          port: 3000
          weight: 1
