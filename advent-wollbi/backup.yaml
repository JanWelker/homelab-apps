---
# WAL and nightly base backups to this database's own bucket; the stanza and
# every choice in it: https://homelab.wlkr.ch/platform/cloudnative-pg/#backups
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: advent-wollbi-db-backup
  namespace: advent-wollbi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-2"
spec:
  bucketName: cnpg-advent-wollbi
  storageClassName: ceph-bucket
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: advent-wollbi-db
  namespace: advent-wollbi
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://cnpg-advent-wollbi/
    endpointURL: https://s3.infra.k8s.wlkr.ch
    s3Credentials:
      accessKeyId: {name: advent-wollbi-db-backup, key: AWS_ACCESS_KEY_ID}
      secretAccessKey: {name: advent-wollbi-db-backup, key: AWS_SECRET_ACCESS_KEY}
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: advent-wollbi-db
  namespace: advent-wollbi
spec:
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: advent-wollbi-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
