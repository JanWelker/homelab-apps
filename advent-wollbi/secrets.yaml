---
# Seeded by `make bao-secrets` in the platform repository. docs/advent-wollbi.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: advent-wollbi-config
  namespace: advent-wollbi
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: advent-wollbi-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: payload-secret
      remoteRef: {key: advent-wollbi/config, property: payload-secret}
    - secretKey: admin-password
      remoteRef: {key: advent-wollbi/config, property: admin-password}
