---
# Generated by the PushSecret at the end of this file. docs/fest-wollbi.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fest-wollbi-config
  namespace: fest-wollbi
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: fest-wollbi-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: payload-secret
      remoteRef: {key: fest-wollbi/config, property: payload-secret}
    - secretKey: admin-password
      remoteRef: {key: fest-wollbi/config, property: admin-password}
---
# Written once, never overwritten. The platform repository's
# docs/platform/openbao.md#generated-secrets
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: fest-wollbi-config
  namespace: fest-wollbi
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys:
    - payload-secret
    - admin-password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: fest-wollbi-config
  namespace: fest-wollbi
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: fest-wollbi-config
  data:
    - match: {secretKey: payload-secret, remoteRef: {remoteKey: fest-wollbi/config, property: payload-secret}}
    - match: {secretKey: admin-password, remoteRef: {remoteKey: fest-wollbi/config, property: admin-password}}
