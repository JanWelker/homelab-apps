---
# What editors upload after the seed. The images the seed imports are in the
# site repository; everything added later exists only here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fest-wollbi-media
  namespace: fest-wollbi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 10Gi
