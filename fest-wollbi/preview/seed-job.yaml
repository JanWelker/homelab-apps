---
# The Pelican content, imported once. The route is part of the image, so this
# is a curl rather than a second image to keep in step; it refuses without
# the secret and does nothing once a page exists, which is what makes it safe
# to run after every sync. docs/fest-wollbi.md#seeding
apiVersion: batch/v1
kind: Job
metadata:
  name: fest-wollbi-seed
  namespace: fest-wollbi-preview
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fest-wollbi-seed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: docker.io/curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              curl -fsS --max-time 600 --retry 10 --retry-delay 15 \
                --retry-all-errors -X POST \
                -H "x-seed-token: $PAYLOAD_SECRET" \
                http://fest-wollbi:3000/seed
              echo
          env:
            - name: PAYLOAD_SECRET
              valueFrom:
                secretKeyRef:
                  name: fest-wollbi-config
                  key: payload-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
