---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fest-wollbi-db
  namespace: fest-wollbi-preview
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  # One instance: the -primary PDB would refuse every drain; see docs/conventions.md
  enablePDB: false

  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:6f187dfa49285b6d483524867be490bc935c0b2a6515c9bfb8578a6ab2e53bc6

  storage:
    size: 1Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: payload
      owner: payload

  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "20"

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
