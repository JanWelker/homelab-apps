---
# Generated into the namespace and never written to OpenBao: a preview's
# secrets live and die with it. refreshInterval 0 generates them once.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: fest-wollbi-config
  namespace: fest-wollbi-preview
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys:
    - payload-secret
    - admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fest-wollbi-config
  namespace: fest-wollbi-preview
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "0"
  target:
    name: fest-wollbi-config
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: fest-wollbi-config
