---
# The Pelican content, imported once. The route is part of the image, so this
# is a curl rather than a second image to keep in step; it refuses without
# the secret and does nothing once a page exists, which is what makes it safe
# to run after every sync. docs/fest-wollbi.md#seeding
apiVersion: batch/v1
kind: Job
metadata:
  name: fest-wollbi-seed
  namespace: fest-wollbi
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fest-wollbi-seed
    spec:
      priorityClassName: batch
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              curl -fsS --max-time 240 --retry 2 --retry-delay 15 \
                --retry-all-errors -X POST \
                -H "x-seed-token: $SEED_TOKEN" \
                http://fest-wollbi:3000/seed
              echo
          env:
            - name: SEED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fest-wollbi-config
                  key: seed-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
