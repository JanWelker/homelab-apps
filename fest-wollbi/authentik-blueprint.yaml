---
# Lands in the authentik namespace; the key must end in .yaml. docs/fest-wollbi.md#oidc
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-fest-wollbi
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  fest-wollbi.yaml: |
    version: 1
    metadata:
      name: homelab-fest-wollbi
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: fest-wollbi-provider
        identifiers:
          name: fest-wollbi-oidc
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          grant_types:
            - authorization_code
          client_id: fest-wollbi
          client_secret: !Env FEST_WOLLBI_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://fest.wollbi.ch/api/users/oauth/callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      # Both wollbi sites declare it; membership stays in Authentik and out of
      # Git. Every member becomes a Payload editor on first sign-in.
      - model: authentik_core.group
        state: present
        id: wollbi-editors
        identifiers:
          name: wollbi-editors
      - model: authentik_core.application
        state: present
        id: fest-wollbi-application
        identifiers:
          slug: fest-wollbi
        attrs:
          name: Wollbi-Fescht
          provider: !KeyOf fest-wollbi-provider
          meta_launch_url: https://fest.wollbi.ch/admin
          meta_description: The street's summer party, since 1987
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf fest-wollbi-application
          group: !KeyOf wollbi-editors
        attrs:
          order: 0
