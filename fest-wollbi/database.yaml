---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fest-wollbi-db
  namespace: fest-wollbi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  # No shutdown waits on the app's connection pool; see docs/conventions.md
  smartShutdownTimeout: 15
  # One instance: the -primary PDB would refuse every drain; see docs/conventions.md
  enablePDB: false

  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:1abcfd1cac6d53cda5185706819aab36d66a4ed88e99fc2ae44ab0826aa99f00

  storage:
    size: 2Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: payload
      owner: payload

  postgresql:
    parameters:
      # No node reserves huge pages, and SELinux denies container_t the probe
      huge_pages: "off"
      shared_buffers: 64MB
      max_connections: "20"

  resources:
    requests:
      cpu: 50m
      memory: 160Mi
    limits:
      memory: 512Mi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: fest-wollbi-db
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fest-wollbi-db-metrics
  namespace: fest-wollbi
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: fest-wollbi-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
