---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fest-wollbi-db
  namespace: fest-wollbi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  # One instance: the -primary PDB would refuse every drain; see docs/conventions.md
  enablePDB: false

  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:f7e00138159bb45d70b624ba25e446924cb3ed1bf366d13e936c3f81b914064e

  storage:
    size: 2Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: payload
      owner: payload

  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "20"

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

  monitoring:
    enablePodMonitor: true
