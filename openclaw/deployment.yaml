---
# Why each setting is what it is: docs/openclaw.md#configuration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Copies the seed only where there is nothing yet: the gateway owns
        # this file once it has started. docs/openclaw.md#configuration
        - name: seed-state
          image: ghcr.io/openclaw/openclaw:2026.9.6@sha256:0a5ff5e682e62afa19149df126aa50063bf65ef885b5c94713ce32dc0eb12e15
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /state /workspace
              [ -e /state/openclaw.json ] || cp /seed/openclaw.json /state/openclaw.json
              [ -e /workspace/AGENTS.md ] || cp /seed/AGENTS.md /workspace/AGENTS.md
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: state
              mountPath: /state
              subPath: state
            - name: state
              mountPath: /workspace
              subPath: workspace
            - name: seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:2026.9.6@sha256:0a5ff5e682e62afa19149df126aa50063bf65ef885b5c94713ce32dc0eb12e15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 18789
              protocol: TCP
          env:
            - name: TZ
              value: Europe/Zurich
            - name: OPENCLAW_GATEWAY_PORT
              value: "18789"
            # Loopback is the image's default and would leave the Service
            # talking to nothing. docs/openclaw.md#pitfalls
            - name: OPENCLAW_GATEWAY_BIND
              value: lan
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-config
                  key: gateway-token
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-config
                  key: anthropic-api-key
            - name: OPENCLAW_SKIP_ONBOARDING
              value: "1"
          volumeMounts:
            - name: state
              mountPath: /home/node/.openclaw
              subPath: state
            - name: state
              mountPath: /home/node/workspace
              subPath: workspace
            - name: tmp
              mountPath: /tmp
          # /startupz admits traffic, /healthz is liveness, /readyz reports
          # the channels; all three answer without a token.
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: openclaw-state
        - name: seed
          configMap:
            name: openclaw-seed
        - name: tmp
          emptyDir: {}
