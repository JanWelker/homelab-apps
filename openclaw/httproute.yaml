---
# authentik-server, not openclaw: the outpost authenticates first, in front
# of the gateway's own shared-secret token. Pointing this at the app leaves
# that token as the only thing between the internet and an agent that can
# run tools. docs/openclaw.md#configuration
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openclaw
  namespace: openclaw
spec:
  parentRefs:
    - name: apps-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "claw.k8s.wlkr.ch"
  rules:
    - backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
