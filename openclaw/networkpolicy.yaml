---
# Every rule and its reason: docs/openclaw.md#network-policy
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: openclaw
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    Default-deny ingress. The Authentik outpost, not the Gateway, reaches
    the control UI; the namespace itself and the node's health probes.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            k8s:app.kubernetes.io/name: authentik
            k8s:app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "18789"
              protocol: TCP
          rules:
            http:
              - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-egress
  namespace: openclaw
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    Default-deny egress. The namespace only; every name outside the cluster
    is in the openclaw policy, and that list is the agent's reach.
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openclaw
  namespace: openclaw
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    The model APIs the agent thinks with, and nothing else. This is the
    one policy here that is a containment boundary rather than hygiene:
    an agent that can run tools reaches exactly these names. No API
    server, no cluster-internal service, no channel platform until one is
    added deliberately.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw
  egress:
    - toFQDNs:
        - matchName: api.anthropic.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
