---
# Generated by the PushSecret at the end of this file, except the Anthropic
# key, which `make bao-secrets` in the platform repository writes to its own
# path. docs/openclaw.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-config
  namespace: openclaw
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openclaw-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: gateway-token
      remoteRef: {key: openclaw/config, property: gateway-token}
    - secretKey: anthropic-api-key
      remoteRef: {key: openclaw/anthropic, property: api-key}
---
# Written once, never overwritten. The platform repository's
# docs/platform/openbao.md#generated-secrets
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: openclaw-config
  namespace: openclaw
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys:
    - gateway-token
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: openclaw-config
  namespace: openclaw
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: openclaw-config
  data:
    - match: {secretKey: gateway-token, remoteRef: {remoteKey: openclaw/config, property: gateway-token}}
