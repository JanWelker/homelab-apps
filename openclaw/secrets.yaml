---
# Seeded by `make bao-secrets` in the platform repository. docs/openclaw.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-config
  namespace: openclaw
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openclaw-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: gateway-token
      remoteRef: {key: openclaw/config, property: gateway-token}
    - secretKey: anthropic-api-key
      remoteRef: {key: openclaw/config, property: anthropic-api-key}
