---
# The identity the openbao-apps store logs in as, limited to kv/opencloud/.
# https://homelab.wlkr.ch/platform/openbao/#kubernetes-auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  namespace: opencloud
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
# Everything `opencloud init` would write into opencloud.yaml, generated by
# the PushSecrets at the end of this file instead, so the pod needs no
# config volume. docs/opencloud.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencloud-env
  namespace: opencloud
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-apps
    kind: ClusterSecretStore
  target:
    name: opencloud-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        OC_JWT_SECRET: "{{ .jwtSecret }}"
        OC_TRANSFER_SECRET: "{{ .transferSecret }}"
        OC_MACHINE_AUTH_API_KEY: "{{ .machineAuthApiKey }}"
        OC_SYSTEM_USER_API_KEY: "{{ .systemUserApiKey }}"
        OC_URL_SIGNING_SECRET: "{{ .urlSigningSecret }}"
        OC_SERVICE_ACCOUNT_SECRET: "{{ .serviceAccountSecret }}"
        IDM_SVC_PASSWORD: "{{ .idmSvcPassword }}"
        IDM_REVASVC_PASSWORD: "{{ .idmRevasvcPassword }}"
        IDM_IDPSVC_PASSWORD: "{{ .idmIdpsvcPassword }}"
        IDM_ADMIN_PASSWORD: "{{ .idmAdminPassword }}"
        # The binds init would write per service: reva's password for the
        # CS3 services, the idm one for graph.
        USERS_LDAP_BIND_PASSWORD: "{{ .idmRevasvcPassword }}"
        GROUPS_LDAP_BIND_PASSWORD: "{{ .idmRevasvcPassword }}"
        AUTH_BASIC_LDAP_BIND_PASSWORD: "{{ .idmRevasvcPassword }}"
        GRAPH_LDAP_BIND_PASSWORD: "{{ .idmSvcPassword }}"
        OC_SYSTEM_USER_ID: "{{ .systemUserId }}"
        OC_ADMIN_USER_ID: "{{ .adminUserId }}"
        OC_SERVICE_ACCOUNT_ID: "{{ .serviceAccountId }}"
        GRAPH_APPLICATION_ID: "{{ .graphApplicationId }}"
        STORAGE_USERS_MOUNT_ID: "{{ .storageUsersMountId }}"
        GATEWAY_STORAGE_USERS_MOUNT_ID: "{{ .storageUsersMountId }}"
  data:
    - secretKey: jwtSecret
      remoteRef: {key: opencloud/config, property: jwt-secret}
    - secretKey: transferSecret
      remoteRef: {key: opencloud/config, property: transfer-secret}
    - secretKey: machineAuthApiKey
      remoteRef: {key: opencloud/config, property: machine-auth-api-key}
    - secretKey: systemUserApiKey
      remoteRef: {key: opencloud/config, property: system-user-api-key}
    - secretKey: urlSigningSecret
      remoteRef: {key: opencloud/config, property: url-signing-secret}
    - secretKey: serviceAccountSecret
      remoteRef: {key: opencloud/config, property: service-account-secret}
    - secretKey: idmSvcPassword
      remoteRef: {key: opencloud/config, property: idm-svc-password}
    - secretKey: idmRevasvcPassword
      remoteRef: {key: opencloud/config, property: idm-revasvc-password}
    - secretKey: idmIdpsvcPassword
      remoteRef: {key: opencloud/config, property: idm-idpsvc-password}
    - secretKey: idmAdminPassword
      remoteRef: {key: opencloud/config, property: idm-admin-password}
    - secretKey: systemUserId
      remoteRef: {key: opencloud/config, property: system-user-id}
    - secretKey: adminUserId
      remoteRef: {key: opencloud/config, property: admin-user-id}
    - secretKey: serviceAccountId
      remoteRef: {key: opencloud/config, property: service-account-id}
    - secretKey: graphApplicationId
      remoteRef: {key: opencloud/config, property: graph-application-id}
    - secretKey: storageUsersMountId
      remoteRef: {key: opencloud/config, property: storage-users-mount-id}
---
# Written once, never overwritten. The platform repository's
# docs/platform/openbao.md#generated-secrets
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: opencloud-config
  namespace: opencloud
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys:
    - jwt-secret
    - transfer-secret
    - machine-auth-api-key
    - system-user-api-key
    - url-signing-secret
    - service-account-secret
    - idm-svc-password
    - idm-revasvc-password
    - idm-idpsvc-password
    - idm-admin-password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: opencloud-config
  namespace: opencloud
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao-apps
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: opencloud-config
  data:
    - match: {secretKey: jwt-secret, remoteRef: {remoteKey: opencloud/config, property: jwt-secret}}
    - match: {secretKey: transfer-secret, remoteRef: {remoteKey: opencloud/config, property: transfer-secret}}
    - match: {secretKey: machine-auth-api-key, remoteRef: {remoteKey: opencloud/config, property: machine-auth-api-key}}
    - match: {secretKey: system-user-api-key, remoteRef: {remoteKey: opencloud/config, property: system-user-api-key}}
    - match: {secretKey: url-signing-secret, remoteRef: {remoteKey: opencloud/config, property: url-signing-secret}}
    - match: {secretKey: service-account-secret, remoteRef: {remoteKey: opencloud/config, property: service-account-secret}}
    - match: {secretKey: idm-svc-password, remoteRef: {remoteKey: opencloud/config, property: idm-svc-password}}
    - match: {secretKey: idm-revasvc-password, remoteRef: {remoteKey: opencloud/config, property: idm-revasvc-password}}
    - match: {secretKey: idm-idpsvc-password, remoteRef: {remoteKey: opencloud/config, property: idm-idpsvc-password}}
    - match: {secretKey: idm-admin-password, remoteRef: {remoteKey: opencloud/config, property: idm-admin-password}}
---
# The IDs opencloud init draws as UUIDs; one generator each, as a UUID
# generator yields one value.
apiVersion: generators.external-secrets.io/v1alpha1
kind: UUID
metadata:
  name: opencloud-system-user-id
  namespace: opencloud
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec: {}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: opencloud-system-user-id
  namespace: opencloud
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao-apps
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: UUID
      name: opencloud-system-user-id
  data:
    - match: {secretKey: uuid, remoteRef: {remoteKey: opencloud/config, property: system-user-id}}
