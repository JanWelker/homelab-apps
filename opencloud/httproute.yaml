---
# infra-gateway, not apps-gateway: LAN and VPN only. docs/opencloud.md#configuration
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencloud
  namespace: opencloud
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: infra-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "cloud.infra.k8s.wlkr.ch"
  rules:
    - backendRefs:
        - name: opencloud
          port: 9200
