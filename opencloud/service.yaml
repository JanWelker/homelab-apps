---
apiVersion: v1
kind: Service
metadata:
  name: opencloud
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud
spec:
  selector:
    app.kubernetes.io/name: opencloud
  ports:
    - name: http
      port: 9200
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9205
      targetPort: metrics
      protocol: TCP
