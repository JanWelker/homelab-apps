---
# Why each value is what it is: docs/opencloud.md#configuration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  namespace: opencloud
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencloud
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencloud
          image: docker.io/opencloudeu/opencloud-rolling:9.0.0@sha256:bd57f039d0dd3df510fb25f178beefdf0b1f049097285feead607824460e6506
          args: ["server"]
          envFrom:
            - secretRef:
                name: opencloud-env
          env:
            - name: OC_URL
              value: https://cloud.infra.k8s.wlkr.ch
            - name: PROXY_TLS
              value: "false"
            - name: PROXY_HTTP_ADDR
              value: 0.0.0.0:9200
            - name: PROXY_DEBUG_ADDR
              value: 0.0.0.0:9205
            - name: OC_INSECURE
              value: "false"
            - name: OC_LOG_LEVEL
              value: info
            - name: OC_LOG_COLOR
              value: "false"
            - name: OC_LOG_PRETTY
              value: "false"
            - name: OC_CONFIG_DIR
              value: /etc/opencloud
            - name: OC_BASE_DATA_PATH
              value: /var/lib/opencloud
            # Storage: PosixFS, non-collaborative. The id cache must be the
            # NATS KV store for this driver.
            - name: STORAGE_USERS_DRIVER
              value: posix
            - name: STORAGE_USERS_ID_CACHE_STORE
              value: nats-js-kv
            # Authentication: Authentik is the IdP, the built-in one does
            # not run, accounts are created in the built-in IDM on first
            # login and keyed on the sub claim.
            - name: OC_EXCLUDE_RUN_SERVICES
              value: idp
            - name: OC_OIDC_ISSUER
              value: https://auth.k8s.wlkr.ch/
            - name: PROXY_OIDC_REWRITE_WELLKNOWN
              value: "true"
            - name: PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD
              value: jwt
            - name: WEB_OIDC_CLIENT_ID
              value: web
            - name: WEB_OIDC_SCOPE
              value: openid profile email
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            - name: PROXY_USER_OIDC_CLAIM
              value: sub
            - name: PROXY_AUTOPROVISION_CLAIM_USERNAME
              value: sub
            - name: PROXY_USER_CS3_CLAIM
              value: username
            - name: OC_LDAP_SERVER_WRITE_ENABLED
              value: "true"
            - name: FRONTEND_READONLY_USER_ATTRIBUTES
              value: user.onPremisesSamAccountName,user.displayName,user.mail,user.passwordProfile,user.memberOf
            # Roles come from Authentik group membership; a user in neither
            # group has no role and no access.
            - name: PROXY_ROLE_ASSIGNMENT_DRIVER
              value: oidc
            - name: PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM
              value: groups
            - name: GRAPH_ASSIGN_DEFAULT_USER_ROLE
              value: "false"
            # Nothing phones home.
            - name: FRONTEND_CHECK_FOR_UPDATES
              value: "false"
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
            - name: metrics
              containerPort: 9205
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/opencloud
            - name: config
              mountPath: /etc/opencloud
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opencloud-data
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
