---
# Merged into upstream's default policy, not replacing it: Authentik for the
# discovery, token and silent-renew requests. docs/opencloud.md#configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-csp
  namespace: opencloud
data:
  csp.yaml: |
    directives:
      connect-src:
        - "https://auth.k8s.wlkr.ch"
      frame-src:
        - "https://auth.k8s.wlkr.ch"
