---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: umami-db
  namespace: umami
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  # No shutdown waits on the app's connection pool; see docs/conventions.md
  smartShutdownTimeout: 15
  # One instance: the -primary PDB would refuse every drain; see docs/conventions.md
  enablePDB: false

  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:c437b7c6c00aa7e66f5d6de1dd83602391fdebd4ff776ffb1ab7aaba5e7351ad

  storage:
    size: 5Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: umami
      owner: umami

  postgresql:
    parameters:
      shared_buffers: 128MB
      max_connections: "50"

  resources:
    requests:
      cpu: 50m
      memory: 160Mi
    limits:
      memory: 512Mi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: umami-db

  monitoring:
    enablePodMonitor: true
