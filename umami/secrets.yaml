---
# The identity the openbao-apps store logs in as, limited to kv/umami/.
# https://homelab.wlkr.ch/platform/openbao/#kubernetes-auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  namespace: umami
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
# Generated by the PushSecret at the end of this file. docs/umami.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-config
  namespace: umami
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-apps
    kind: ClusterSecretStore
  target:
    name: umami-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: app-secret
      remoteRef: {key: umami/config, property: app-secret}
    - secretKey: two-factor-encryption-key
      remoteRef: {key: umami/config, property: two-factor-encryption-key}
---
# Written once, never overwritten. The platform repository's
# docs/platform/openbao.md#generated-secrets
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: umami-config
  namespace: umami
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 32
  symbols: 0
  allowRepeat: true
  encoding: hex
  secretKeys:
    - app-secret
    - two-factor-encryption-key
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: umami-config
  namespace: umami
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao-apps
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: umami-config
  data:
    - match: {secretKey: app-secret, remoteRef: {remoteKey: umami/config, property: app-secret}}
    - match: {secretKey: two-factor-encryption-key, remoteRef: {remoteKey: umami/config, property: two-factor-encryption-key}}
