---
# Seeded by `make bao-secrets` in the platform repository. docs/umami.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-config
  namespace: umami
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: umami-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: app-secret
      remoteRef: {key: umami/config, property: app-secret}
    - secretKey: two-factor-encryption-key
      remoteRef: {key: umami/config, property: two-factor-encryption-key}
