---
# Every rule and its reason: docs/umami.md#network-policy
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: umami
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    Default-deny ingress. The Authentik outpost, not the Gateway, reaches
    the pod, for the tracker paths as much as for the dashboard;
    Prometheus, the CloudNativePG operator, the namespace itself and the
    node's health probes.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            k8s:app.kubernetes.io/name: authentik
            k8s:app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
          rules:
            http:
              - {}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics$
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-egress
  namespace: umami
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    Default-deny egress. The namespace only: the update check, the
    telemetry and the website icons are switched off, so nothing outside
    the cluster is dialled.
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: database
  namespace: umami
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    The CloudNativePG instance manager reports its status to the API
    server; its liveness check fails without it.
  endpointSelector:
    matchLabels:
      cnpg.io/podRole: instance
  egress:
    - toEntities:
        - kube-apiserver
