---
# authentik-server, not jellyfin: the outpost authenticates first, in front
# of Jellyfin's own login. Pointing this at the app removes that layer.
# docs/jellyfin.md#configuration
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  parentRefs:
    - name: apps-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "media.k8s.wlkr.ch"
  rules:
    - backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
