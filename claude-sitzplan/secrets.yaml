# only. https://homelab.wlkr.ch/platform/openbao/#kubernetes-auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  namespace: claude-sitzplan
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
