---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: claude-sitzplan
  namespace: argocd
spec:
  project: apps
  sources:
    # An OCI chart, so its source has no directory to exclude application.yaml from.
    # Why each value is what it is: docs/claude-agents.md#configuration
    - repoURL: ghcr.io/janwelker/charts
      chart: agent-mooring
      targetRevision: 0.5.82
      helm:
        valuesObject:
          session: sitzplan
          repos:
            - JanWelker/sitzplan.schlumpf.me
          # The same skills as the laptop; see docs/claude-agents.md#configuration
          skills:
            repo: JanWelker/claude-skills
          kubernetes:
            access: none
          argocd:
            enabled: false
          # The session token lives at kv/claude-<session>/github; see docs/claude-agents.md#secrets
          secretStore:
            name: openbao-apps
            kind: ClusterSecretStore
          # npm for installs and builds; see docs/claude-agents.md#sessions
          extraEgressFQDNs:
            - matchName: registry.npmjs.org
          # Idle most of the time; see docs/claude-agents.md#configuration
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 4Gi
          ssh:
            authorizedKeys:
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL82FO80OOfYjJMFyyazi607vRV6FGdvx/TMfTE5615c
    # The namespace's objects the chart does not render; see docs/claude-agents.md#configuration
    - repoURL: https://github.com/JanWelker/homelab-apps.git
      targetRevision: HEAD
      path: claude-sitzplan
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: claude-sitzplan
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
