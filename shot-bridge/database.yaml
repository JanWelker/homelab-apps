---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shot-bridge-db
  namespace: shot-bridge
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Two instances so a drain or a node loss fails over instead of taking the
  # bridge's history down; see docs/shot-bridge.md#configuration
  instances: 2
  # A spec change promotes a replica first, and no shutdown waits on the
  # app's connection pool; see docs/conventions.md
  primaryUpdateMethod: switchover
  smartShutdownTimeout: 15
  # The operator's PDBs stay on: a drain switches the primary over first.
  # See docs/shot-bridge.md#configuration

  # The operator's anti-affinity is a preference the scheduler outweighs on
  # unequal nodes; this keeps the two apart.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          cnpg.io/cluster: shot-bridge-db
          cnpg.io/podRole: instance

  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:5a5dfbde88d5909fd4938189c141f53fb153f53c519f14907dce9e7c04baa153

  # pg_wal alone holds about 600 MiB; see docs/shot-bridge.md#configuration
  storage:
    size: 2Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: shot_bridge
      owner: shot_bridge

  postgresql:
    parameters:
      shared_buffers: 32MB
      # The bridge's pool holds at most 4, migrate-sqlite 4 more while it runs.
      max_connections: "20"
      # A quarter of the volume, so a dead replica's slot cannot fill the
      # primary; see the homelab's docs/platform/cloudnative-pg.md#pitfalls
      max_slot_wal_keep_size: 256MB

  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 256Mi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: shot-bridge-db

  monitoring:
    enablePodMonitor: true
