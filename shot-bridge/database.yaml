---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shot-bridge-db
  namespace: shot-bridge
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Two instances so a drain or a node loss fails over instead of taking the
  # bridge's history down; see docs/shot-bridge.md#configuration
  instances: 2
  # The -primary PDB would refuse the primary's eviction on every drain;
  # without it the operator fails over. See docs/conventions.md
  enablePDB: false

  # The operator's anti-affinity is a preference the scheduler outweighs on
  # unequal nodes; this keeps the two apart.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          cnpg.io/cluster: shot-bridge-db
          cnpg.io/podRole: instance

  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:348997438269fddc0e2825e00594367ad61751adb08a7698a0a14f793b0dc2ce

  storage:
    size: 1Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: shot_bridge
      owner: shot_bridge

  postgresql:
    parameters:
      shared_buffers: 32MB
      # The bridge's pool holds at most 4, migrate-sqlite 4 more while it runs.
      max_connections: "20"

  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 256Mi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: shot-bridge-db

  monitoring:
    enablePodMonitor: true
