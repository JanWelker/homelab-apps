---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shot-bridge
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    link.argocd.argoproj.io/external-link: https://shot.k8s.wlkr.ch/healthz
spec:
  project: apps
  sources:
    # Why each value is what it is: docs/shot-bridge.md#configuration
    - repoURL: ghcr.io/somuch-cloud/charts
      chart: shot-bridge
      targetRevision: 0.1.19
      helm:
        valuesObject:
          timeZone: Europe/Zurich
          lm:
            serial: MR054797
          apns:
            teamId: 5WUHTP2MDN
            bundleId: ch.wlkr.shottimer
            env: sandbox
          existingSecret: shot-bridge
          database:
            existingSecret: shot-bridge-db-app
          admin:
            enabled: true
          persistence:
            storageClassName: rook-ceph-block
            annotations:
              argocd.argoproj.io/sync-options: Prune=false
          httpRoute:
            enabled: true
            hostname: shot.k8s.wlkr.ch
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: apps-gateway
                namespace: kube-system
                sectionName: https
          networkPolicy:
            enabled: true
            annotations:
              argocd.argoproj.io/sync-wave: "-2"
    - repoURL: https://github.com/JanWelker/homelab-apps.git
      targetRevision: HEAD
      path: shot-bridge
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: shot-bridge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - ServerSideApply=true
