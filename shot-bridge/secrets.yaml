---
# kv/shot-bridge/accounts is written by `make bao-secrets` in the platform repository;
# kv/shot-bridge/config is generated by the PushSecret at the end of this file.
# docs/shot-bridge.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shot-bridge
  namespace: shot-bridge
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: shot-bridge
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LM_USERNAME
      remoteRef: {key: shot-bridge/accounts, property: lm-username}
    - secretKey: LM_PASSWORD
      remoteRef: {key: shot-bridge/accounts, property: lm-password}
    - secretKey: APNS_KEY_ID
      remoteRef: {key: shot-bridge/accounts, property: apns-key-id}
    - secretKey: AuthKey.p8
      remoteRef: {key: shot-bridge/accounts, property: apns-key-p8}
    - secretKey: BRIDGE_API_KEY
      remoteRef: {key: shot-bridge/config, property: api-key}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: shot-bridge-config
  namespace: shot-bridge
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 48
  symbols: 0
  allowRepeat: true
  secretKeys:
    - api-key
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: shot-bridge-config
  namespace: shot-bridge
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: shot-bridge-config
  data:
    - match: {secretKey: api-key, remoteRef: {remoteKey: shot-bridge/config, property: api-key}}
