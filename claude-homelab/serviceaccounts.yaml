# The platform repository binds both to the claude-agent-read ClusterRole
# cluster-wide and binds claude-agent-write nowhere. A session opts in to
# the token with kubernetes.access in its chart values:
# docs/claude-agents.md#configuration
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-reader
  namespace: claude-homelab
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-writer
  namespace: claude-homelab
automountServiceAccountToken: false
