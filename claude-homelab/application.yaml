---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: claude-homelab
  namespace: argocd
spec:
  project: apps
  source:
    # An OCI chart, so there is no directory to exclude application.yaml from.
    # Why each value is what it is: docs/claude-agents.md#configuration
    repoURL: ghcr.io/janwelker/charts
    chart: claude-agent
    targetRevision: 0.1.1
    helm:
      valuesObject:
        session: homelab
        repo: JanWelker/homelab
        kubernetes:
          access: read
        argocd:
          enabled: true
        ssh:
          authorizedKeys:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID3ZpwI02mjSUaGfrNWgFn9L6bBfzdTcZOtgkyfi6DLD
  destination:
    server: https://kubernetes.default.svc
    namespace: claude-agents
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
