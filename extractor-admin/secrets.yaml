---
# kv/shot-bridge/config is generated by the PushSecret in shot-bridge/secrets.yaml;
# the bridge reads the same property, so the two cannot drift apart.
# docs/extractor-admin.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: extractor-admin
  namespace: extractor-admin
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: extractor-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: BRIDGE_ADMIN_READ_KEY
      remoteRef: {key: shot-bridge/config, property: admin-read-key}
