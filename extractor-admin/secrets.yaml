---
# The identity the openbao-apps store logs in as, limited to kv/extractor-admin/.
# https://homelab.wlkr.ch/platform/openbao/#kubernetes-auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  namespace: extractor-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
# kv/extractor-admin/config is a copy of the bridge's admin-read-key in
# kv/shot-bridge/config, written by hand. docs/extractor-admin.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: extractor-admin
  namespace: extractor-admin
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-apps
    kind: ClusterSecretStore
  target:
    name: extractor-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: BRIDGE_ADMIN_READ_KEY
      remoteRef: {key: extractor-admin/config, property: admin-read-key}
