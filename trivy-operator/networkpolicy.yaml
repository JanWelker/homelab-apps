---
# Cilium, not NetworkPolicy: a plain one blocks the kubelet's health probes and
# the pod restarts forever. See the homelab repository's Security Policies page.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: trivy-system
spec:
  description: >-
    Default-deny ingress for Trivy Operator. Nothing here serves users: the
    operator exposes only a metrics endpoint, and the built-in Trivy server
    answers scan jobs inside this namespace. So the allowed callers are the
    scan jobs themselves (intra-namespace), the node for health probes, and
    Prometheus for the scrape -- the same three every metrics-only workload
    needs. Egress is unrestricted on purpose: a scanner that cannot reach a
    registry or the vulnerability database reports zero findings rather than
    an error, which is the worst possible failure mode for this workload.
  endpointSelector: {}
  ingress:
    # Scan jobs reaching the built-in Trivy server on 4954, and the operator
    # reaching it to check its health.
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
