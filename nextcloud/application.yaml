---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    link.argocd.argoproj.io/external-link: https://cloud.k8s.wlkr.ch
spec:
  project: apps
  sources:
    # Why each value is what it is: docs/nextcloud.md#configuration
    - repoURL: https://nextcloud.github.io/helm/
      chart: nextcloud
      targetRevision: 9.3.0
      helm:
        valuesObject:
          image:
            repository: library/nextcloud
            flavor: apache

          nextcloud:
            host: cloud.k8s.wlkr.ch

            podSecurityContext:
              seccompProfile:
                type: RuntimeDefault
            securityContext:
              seccompProfile:
                type: RuntimeDefault

            # Without this block the chart installs as admin / changeme.
            existingSecret:
              enabled: true
              secretName: nextcloud-admin
              usernameKey: username
              passwordKey: password

            openmetrics:
              allowedClients:
                - "127.0.0.1"
                - "10.244.0.0/16"
                - "10.96.0.0/12"

            extraEnv:
              - name: OVERWRITEPROTOCOL
                value: https
              - name: OVERWRITEHOST
                value: cloud.k8s.wlkr.ch
              - name: OVERWRITECLIURL
                value: https://cloud.k8s.wlkr.ch
              - name: TRUSTED_PROXIES
                value: "10.244.0.0/16"
              - name: NEXTCLOUD_OIDC_CLIENT_ID
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-oidc
                    key: client-id
              - name: NEXTCLOUD_OIDC_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-oidc
                    key: client-secret

            # Runs on every start. Every command is idempotent: docs/nextcloud.md#oidc
            hooks:
              before-starting: |
                #!/bin/sh
                set -eu
                php occ app:install user_oidc || php occ app:enable user_oidc

                # The chart never applies allowedClients itself: nextcloud/helm#887
                php occ config:system:delete openmetrics_allowed_clients
                i=0
                for cidr in $(echo "${OPENMETRICS_ALLOWED_CLIENTS:-}" | tr ',' ' '); do
                  php occ config:system:set openmetrics_allowed_clients "$i" \
                    --value="$cidr"
                  i=$((i + 1))
                done

                # SSRF guard: auth.k8s.wlkr.ch resolves to a private address.
                php occ config:system:set allow_local_remote_servers \
                  --type boolean --value true

                # Not fatal: on a first deploy the provider may not exist yet.
                discovery="https://auth.k8s.wlkr.ch/application/o/nextcloud/.well-known/openid-configuration"
                php occ user_oidc:provider Authentik \
                  --clientid="$NEXTCLOUD_OIDC_CLIENT_ID" \
                  --clientsecret="$NEXTCLOUD_OIDC_CLIENT_SECRET" \
                  --discoveryuri="$discovery" \
                  --unique-uid=0 \
                  --mapping-uid=preferred_username \
                  --mapping-email=email \
                  --mapping-display-name=name \
                  --scope="openid email profile" \
                  --check-bearer=0 || true

                # Hide the local login only once the issuer answers.
                if curl -fsS --max-time 10 "$discovery" | grep -q '"issuer"'; then
                  php occ config:system:set hide_login_form --type boolean --value true
                else
                  php occ config:system:set hide_login_form --type boolean --value false
                  echo "WARNING: $discovery did not answer with an issuer; leaving the local login form visible." >&2
                  echo "  See docs/nextcloud.md#oidc" >&2
                fi

          internalDatabase:
            enabled: false

          externalDatabase:
            enabled: true
            type: postgresql
            existingSecret:
              enabled: true
              secretName: nextcloud-db-app
              usernameKey: username
              passwordKey: password
              hostKey: host
              databaseKey: dbname

          redis:
            enabled: false

          persistence:
            enabled: true
            storageClass: rook-ceph-block
            accessMode: ReadWriteOnce
            size: 50Gi
            annotations:
              argocd.argoproj.io/sync-options: Prune=false

          startupProbe:
            enabled: true
            failureThreshold: 60
            periodSeconds: 10

          replicaCount: 1
          deploymentStrategy:
            type: Recreate

          cronjob:
            enabled: true
            sidecar:
              securityContext:
                seccompProfile:
                  type: RuntimeDefault

          metrics:
            enabled: true
            podSecurityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            securityContext:
              runAsUser: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault

          # `prometheus.`, not `metrics.serviceMonitor`: the documented key renders nothing.
          prometheus:
            serviceMonitor:
              enabled: true
              interval: 30s

          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi

    - repoURL: https://github.com/JanWelker/homelab-apps.git
      targetRevision: HEAD
      path: nextcloud
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - ServerSideApply=true
