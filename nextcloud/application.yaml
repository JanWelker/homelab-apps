---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    link.argocd.argoproj.io/external-link: https://cloud.k8s.wlkr.ch
spec:
  project: apps
  sources:
    # The Nextcloud organisation's own chart, from the repository Nextcloud
    # publishes. Not a repackager's. See CONVENTIONS.md.
    - repoURL: https://nextcloud.github.io/helm/
      chart: nextcloud
      targetRevision: 9.3.0
      helm:
        valuesObject:
          image:
            repository: library/nextcloud
            flavor: apache

          nextcloud:
            host: cloud.k8s.wlkr.ch

            # user_oidc reads these; so does the hook below. The Secret is the
            # same one Authentik's blueprint reads the pair from, so the
            # provider and its client are configured from one place and
            # neither is ever copied out of a UI.
            extraEnv:
              # Behind the apps-gateway, TLS is terminated before the request
              # arrives and the source address is Cilium's Envoy. Without these
              # Nextcloud builds http:// links on an https:// site, and
              # user_oidc refuses to start a login at all with "You must access
              # Nextcloud with HTTPS to use OpenID Connect".
              #
              # Env vars, not a file in `nextcloud.configs`: the image ships
              # reverse-proxy.config.php, which reads exactly these, and config
              # files load alphabetically -- a proxy.config.php of our own
              # would be overridden by the one the image already has.
              - name: OVERWRITEPROTOCOL
                value: https
              - name: OVERWRITEHOST
                value: cloud.k8s.wlkr.ch
              - name: OVERWRITECLIURL
                value: https://cloud.k8s.wlkr.ch
              - name: TRUSTED_PROXIES
                value: "10.244.0.0/16"
              - name: NEXTCLOUD_OIDC_CLIENT_ID
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-oidc
                    key: client-id
              - name: NEXTCLOUD_OIDC_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-oidc
                    key: client-secret

            # before-starting is the last hook the image runs, on every
            # start, after an install or an upgrade has finished -- so one
            # hook covers both cases and re-asserts the configuration if
            # someone changes it in the UI. Every command here is idempotent:
            # app:install is a no-op once installed, and user_oidc:provider
            # updates the provider of that name rather than adding a second.
            hooks:
              before-starting: |
                #!/bin/sh
                set -eu
                php occ app:install user_oidc || php occ app:enable user_oidc

                # Not fatal, deliberately. Authentik discovers the provider
                # blueprint asynchronously -- on its worker's startup, hourly,
                # or when the file watcher notices -- so on a first deploy this
                # can run before the provider exists. A Nextcloud that will not
                # start is a far worse outcome than one that is up with the
                # local login still available, and this hook runs again on
                # every start, so the next restart fixes it.
                discovery="https://auth.k8s.wlkr.ch/application/o/nextcloud/.well-known/openid-configuration"

                # Nextcloud refuses to let its own HTTP client reach a private
                # address -- an SSRF guard, and a sensible default for a server
                # that fetches URLs users give it. But auth.k8s.wlkr.ch is the
                # apps Gateway, 10.9.2.249, so every discovery fetch failed
                # with:
                #
                #   Host "10.9.2.249" (auth.k8s.wlkr.ch:80) violates local
                #   access rules
                #
                # Pointing user_oidc at the in-cluster Service instead would
                # dodge the guard and break the issuer check, since the browser
                # and the server would then discover different issuers.
                #
                # So the guard is lifted. It is a real reduction in defence in
                # depth -- it applies to every outbound request Nextcloud
                # makes, not just this one -- and the compensating control is
                # the namespace's CiliumNetworkPolicy plus the fact that
                # federation and external storage are not enabled here.
                php occ config:system:set allow_local_remote_servers \
                  --type boolean --value true

                php occ user_oidc:provider Authentik \
                  --clientid="$NEXTCLOUD_OIDC_CLIENT_ID" \
                  --clientsecret="$NEXTCLOUD_OIDC_CLIENT_SECRET" \
                  --discoveryuri="$discovery" \
                  --unique-uid=0 \
                  --mapping-uid=preferred_username \
                  --mapping-email=email \
                  --mapping-display-name=name \
                  --scope="openid email profile" \
                  --check-bearer=0 || true

                # Registering the provider does not prove it works --
                # user_oidc:provider never fetches the discovery document, so
                # it succeeds just as happily against a provider Authentik has
                # not created yet. Hiding the login form on the strength of
                # that exit code is how everyone ends up locked out behind a
                # button that 404s, which is exactly what happened the first
                # time this ran.
                #
                # So ask the issuer directly, and only hide the form once it
                # answers. The `false` branch is not a no-op: it brings the
                # form back if a working login later stops working.
                if curl -fsS --max-time 10 "$discovery" | grep -q '"issuer"'; then
                  php occ config:system:set hide_login_form --type boolean --value true
                else
                  php occ config:system:set hide_login_form --type boolean --value false
                  echo "WARNING: $discovery did not answer with an issuer." >&2
                  echo "  Leaving the local login form visible rather than" >&2
                  echo "  locking everyone out behind a button that 404s." >&2
                  echo "  Check that Authentik's worker has the NEXTCLOUD_*" >&2
                  echo "  env vars -- envFrom only injects them at pod start," >&2
                  echo "  so a Secret updated later needs a worker restart." >&2
                fi

          internalDatabase:
            # Never the chart's own database. CloudNativePG runs it instead,
            # from database.yaml in this directory.
            enabled: false

          externalDatabase:
            enabled: true
            type: postgresql
            existingSecret:
              enabled: true
              # Written by CloudNativePG. No password is copied anywhere.
              secretName: nextcloud-db-app
              usernameKey: username
              passwordKey: password
              hostKey: host
              databaseKey: dbname

          redis:
            # Disabled deliberately: the chart's Redis is a Bitnami subchart
            # already pointing at bitnamilegacy. One replica does not need a
            # shared cache, and APCu is configured by default for the local one.
            enabled: false

          persistence:
            enabled: true
            storageClass: rook-ceph-block
            accessMode: ReadWriteOnce
            size: 50Gi

          # Nextcloud runs database migrations on startup after an upgrade,
          # which takes it well past a default liveness probe's patience.
          startupProbe:
            enabled: true
            failureThreshold: 60
            periodSeconds: 10

          # One replica, one ReadWriteOnce volume: a surging second pod cannot
          # mount it and the rollout wedges until the deadline expires.
          replicaCount: 1
          deploymentStrategy:
            type: Recreate

          cronjob:
            # Nextcloud's background jobs. Left at the default type `sidecar`
            # deliberately: a separate CronJob pod would have to mount the same
            # ReadWriteOnce volume as the web pod, which only works while both
            # land on one node.
            enabled: true

          metrics:
            # The nextcloud-exporter sidecar deployment. It authenticates as
            # the admin account from the same Secret the app uses.
            enabled: true

          prometheus:
            # Note the key: the chart's ServiceMonitor reads `prometheus.`,
            # not `metrics.serviceMonitor`, despite what the values file's own
            # comments say. Setting the documented one renders nothing at all.
            serviceMonitor:
              enabled: true
              interval: 30s

          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi

    # The database, the route, the policy and the admin secret: everything the
    # chart does not render.
    - repoURL: https://github.com/JanWelker/homelab-apps.git
      targetRevision: HEAD
      path: nextcloud
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - ServerSideApply=true
