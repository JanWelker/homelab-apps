---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-db
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  # One instance: the -primary PDB would refuse every drain; see docs/conventions.md
  enablePDB: false

  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:6f187dfa49285b6d483524867be490bc935c0b2a6515c9bfb8578a6ab2e53bc6

  storage:
    size: 20Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud

  postgresql:
    parameters:
      shared_buffers: 256MB
      max_connections: "100"

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

  monitoring:
    enablePodMonitor: true
