---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-db
  namespace: nextcloud
  annotations:
    # Ahead of the chart: ArgoCD has a health check for this kind, so the wave
    # does not advance until Postgres reports "Cluster in healthy state". The
    # chart's install job connects to the database immediately and fails the
    # sync if it is not there yet.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1

  # Renovate tracks this through the cnpg-image-name manager in renovate.json.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie

  storage:
    size: 20Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud

  postgresql:
    parameters:
      shared_buffers: 256MB
      max_connections: "100"

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

  monitoring:
    enablePodMonitor: true
