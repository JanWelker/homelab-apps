---
# Cilium, not NetworkPolicy: a plain one blocks the kubelet's health probes and
# the pod restarts forever. See the homelab repository's Security Policies page.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: nextcloud
  annotations:
    # With the namespace, ahead of the Cluster at -1: the cnpg-system rule below
    # is what lets that Cluster go Healthy, and a wave cannot wait on a policy
    # it has not applied yet. See the docs page.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    Default-deny ingress for Nextcloud. The UI arrives through the Gateway,
    the web pod, its cron sidecar and the metrics exporter reach Postgres
    and each other inside the namespace, the CloudNativePG operator polls
    that database's status endpoint, Prometheus scrapes the exporter, the
    database and Nextcloud's own metrics page, and the node runs the health
    probes.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "9205"
              protocol: TCP
            - port: "9187"
              protocol: TCP
          rules:
            http:
              - {}
    # CloudNativePG's operator polls each instance's status endpoint from
    # cnpg-system. Without it the Cluster is stuck reporting "Instance Status
    # Extraction Error", which ArgoCD waits on forever -- see the docs page.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-egress
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    Default-deny egress for Nextcloud. Postgres and the exporter's scrape of
    the web pod stay inside the namespace. What leaves the cluster is per
    workload below; the exporter and the database have nothing to say
    outside.
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nextcloud
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    The web pod and its cron sidecar log users in at Authentik through the
    public name, which resolves to the apps Gateway's own address and is
    world to Cilium; the Gateway's Envoy then checks this policy against
    the Authentik server pod it picks and answers 403 itself when the pod
    is not listed, so the pod is listed too. They call the Nextcloud
    project's hosts for the app
    store, update notifications and the announcement feed. This is the
    control allow_local_remote_servers gives up: the SSRF guard is off, the
    policy is what says where a request may go.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
      app.kubernetes.io/component: app
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            k8s:app.kubernetes.io/name: authentik
            k8s:app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - toFQDNs:
        - matchName: auth.k8s.wlkr.ch
        - matchPattern: "*.nextcloud.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: database
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    The CloudNativePG instance manager reports its status to the API
    server; its liveness check fails without it.
  endpointSelector:
    matchLabels:
      cnpg.io/podRole: instance
  egress:
    - toEntities:
        - kube-apiserver
