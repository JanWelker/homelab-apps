---
# Generated by the PushSecret at the end of this file. docs/nextcloud.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-admin
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nextcloud-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef: {key: nextcloud/config, property: username}
    - secretKey: password
      remoteRef: {key: nextcloud/config, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-oidc
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nextcloud-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-id
      remoteRef: {key: nextcloud/config, property: oidc-client-id}
    - secretKey: client-secret
      remoteRef: {key: nextcloud/config, property: oidc-client-secret}
---
# Written once, never overwritten. The platform repository's
# docs/platform/openbao.md#generated-secrets
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: nextcloud-config
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys:
    - password
    - oidc-client-id
    - oidc-client-secret
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: nextcloud-config
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: nextcloud-config
  template:
    engineVersion: v2
    data:
      username: admin
  data:
    - match: {secretKey: username, remoteRef: {remoteKey: nextcloud/config, property: username}}
    - match: {secretKey: password, remoteRef: {remoteKey: nextcloud/config, property: password}}
    - match: {secretKey: oidc-client-id, remoteRef: {remoteKey: nextcloud/config, property: oidc-client-id}}
    - match: {secretKey: oidc-client-secret, remoteRef: {remoteKey: nextcloud/config, property: oidc-client-secret}}
