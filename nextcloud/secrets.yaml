---
# The Nextcloud admin account. Generate and store once, from a machine that can
# reach OpenBao:
#
#   make bao-secrets
#
# in the platform repository, which generates the whole path:
#
#   username / password              the break-glass local admin
#   oidc-client-id / -client-secret  shared with Authentik's own ExternalSecret
#
# The database password is deliberately not here: CloudNativePG generates it
# into nextcloud-db-app and nothing outside the cluster ever needs to know it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-admin
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # With the database, ahead of the chart that reads it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nextcloud-admin
    creationPolicy: Owner
    # Retain: losing this Secret does not lose the account, but it does lose
    # the only copy of the password outside OpenBao.
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef: {key: nextcloud/config, property: username}
    - secretKey: password
      remoteRef: {key: nextcloud/config, property: password}
---
# The other half of kv/nextcloud/config. Authentik reads the same two values
# through its own ExternalSecret and configures the provider with them, so the
# provider and the client it authenticates are generated once, in one place,
# and neither is copied out of a UI after a rebuild.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-oidc
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # With the database, ahead of the chart whose hook reads it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nextcloud-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-id
      remoteRef: {key: nextcloud/config, property: oidc-client-id}
    - secretKey: client-secret
      remoteRef: {key: nextcloud/config, property: oidc-client-secret}
