---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: infra-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "cloud.infra.k8s.wlkr.ch"
  rules:
    - backendRefs:
        - name: nextcloud
          port: 8080
