---
# The app's own Service, not authentik-server: browsers on kneadtime.pizza
# call this API directly, and there is no user to log in. /v1 only, so the
# probes and /metrics on the same port stay in the cluster.
# docs/kneadtime.md#configuration
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kneadtime
  namespace: kneadtime
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: apps-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "kneadtime.k8s.wlkr.ch"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: SAMEORIGIN
      backendRefs:
        - name: kneadtime
          port: 80
