---
# Seeded by `make bao-secrets` in the platform repository. docs/kneadtime.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kneadtime-vapid
  namespace: kneadtime
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: kneadtime-vapid
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: vapid-private-key
      remoteRef: {key: kneadtime/config, property: vapid-private-key}
