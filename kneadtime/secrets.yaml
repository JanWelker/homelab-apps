---
# The identity the openbao-apps store logs in as, limited to kv/kneadtime/.
# https://homelab.wlkr.ch/platform/openbao/#kubernetes-auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  namespace: kneadtime
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
# Seeded by `make bao-secrets` in the platform repository. docs/kneadtime.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kneadtime-vapid
  namespace: kneadtime
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-apps
    kind: ClusterSecretStore
  target:
    name: kneadtime-vapid
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: vapid-private-key
      remoteRef: {key: kneadtime/config, property: vapid-private-key}
