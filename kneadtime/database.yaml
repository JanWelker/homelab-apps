---
# Why a Cluster and not SQLite: docs/kneadtime.md#configuration
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kneadtime-db
  namespace: kneadtime
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  # One instance: the -primary PDB would refuse every drain; see docs/conventions.md
  enablePDB: false

  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:fee233b6d388273e61313f93ac5bfb75449ecd6e107b804b19583526db0f5760

  storage:
    size: 2Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: kneadtime
      owner: kneadtime

  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "20"

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

  monitoring:
    enablePodMonitor: true
