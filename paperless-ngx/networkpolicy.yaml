---
# Every rule and its reason: docs/paperless-ngx.md#network-policy
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: paperless-ngx
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    Default-deny ingress. The Gateway reaches the app directly, because the
    login is OIDC; Prometheus, the CloudNativePG operator, the namespace
    itself and the node's health probes.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics$
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-egress
  namespace: paperless-ngx
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    Default-deny egress. The namespace only: the database, the broker and
    nothing else.
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    Authentik for logins, and nothing else that leaves the cluster: OCR is
    local, the update check is off, and no document ever goes out.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: paperless-ngx
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            k8s:app.kubernetes.io/name: authentik
            k8s:app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - toFQDNs:
        - matchName: auth.k8s.wlkr.ch
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: database
  namespace: paperless-ngx
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    The CloudNativePG instance manager reports its status to the API
    server; its liveness check fails without it.
  endpointSelector:
    matchLabels:
      cnpg.io/podRole: instance
  egress:
    - toEntities:
        - kube-apiserver
