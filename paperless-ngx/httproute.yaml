---
# The app's own Service, not authentik-server: Paperless speaks OIDC, so the
# outpost is not in the path. docs/paperless-ngx.md#oidc
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  parentRefs:
    - name: apps-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "paperless.k8s.wlkr.ch"
  rules:
    - backendRefs:
        - name: paperless-ngx
          port: 8000
