---
apiVersion: v1
kind: Namespace
metadata:
  name: paperless-ngx
  labels:
    # baseline, not restricted: the image starts as root to take ownership of
    # the volumes and drops to uid 1000 itself. docs/paperless-ngx.md#configuration
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-2"
