---
# Lands in the authentik namespace; the key must end in .yaml. docs/paperless-ngx.md#oidc
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-paperless-ngx
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  paperless-ngx.yaml: |
    version: 1
    metadata:
      name: homelab-paperless-ngx
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: paperless-ngx-provider
        identifiers:
          name: paperless-ngx
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          client_id: !Env PAPERLESS_NGX_CLIENT_ID
          client_secret: !Env PAPERLESS_NGX_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://paperless.k8s.wlkr.ch/accounts/oidc/authentik/login/callback/
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: paperless-ngx
        attrs:
          name: Paperless-ngx
          provider: !KeyOf paperless-ngx-provider
          meta_launch_url: https://paperless.k8s.wlkr.ch
          meta_description: The household's paper, scanned and searchable
