---
# Generated by the PushSecret at the end of this file. docs/paperless-ngx.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ngx-config
  namespace: paperless-ngx
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: paperless-ngx-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secret-key
      remoteRef: {key: paperless-ngx/config, property: secret-key}
    - secretKey: admin-password
      remoteRef: {key: paperless-ngx/config, property: admin-password}
---
# django-allauth reads one JSON document, secret included, so the template
# assembles it here rather than putting the client secret in Git.
# docs/paperless-ngx.md#oidc
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ngx-oidc
  namespace: paperless-ngx
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: paperless-ngx-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        socialaccount-providers: >-
          {"openid_connect":{"APPS":[{"provider_id":"authentik","name":"Authentik","client_id":"{{ .clientId }}","secret":"{{ .clientSecret }}","settings":{"server_url":"https://auth.k8s.wlkr.ch/application/o/paperless-ngx/.well-known/openid-configuration"}}]}}
  data:
    - secretKey: clientId
      remoteRef: {key: paperless-ngx/config, property: oidc-client-id}
    - secretKey: clientSecret
      remoteRef: {key: paperless-ngx/config, property: oidc-client-secret}
---
# Written once, never overwritten. The platform repository's
# docs/platform/openbao.md#generated-secrets
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: paperless-ngx-config
  namespace: paperless-ngx
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys:
    - secret-key
    - admin-password
    - oidc-client-id
    - oidc-client-secret
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: paperless-ngx-config
  namespace: paperless-ngx
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: paperless-ngx-config
  data:
    - match: {secretKey: secret-key, remoteRef: {remoteKey: paperless-ngx/config, property: secret-key}}
    - match: {secretKey: admin-password, remoteRef: {remoteKey: paperless-ngx/config, property: admin-password}}
    - match: {secretKey: oidc-client-id, remoteRef: {remoteKey: paperless-ngx/config, property: oidc-client-id}}
    - match: {secretKey: oidc-client-secret, remoteRef: {remoteKey: paperless-ngx/config, property: oidc-client-secret}}
