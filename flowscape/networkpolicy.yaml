---
# Every rule and its reason: docs/flowscape.md#network-policy
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: flowscape
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    Default-deny ingress. The Authentik outpost, not the Gateway, reaches
    the UI; Prometheus scrapes the metrics; the namespace itself and the
    node's health probes.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            k8s:app.kubernetes.io/name: authentik
            k8s:app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - {}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics$
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-egress
  namespace: flowscape
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    Default-deny egress. The namespace only; the one thing the app dials
    is in the flowscape policy.
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flowscape
  namespace: flowscape
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: >-
    Flowscape reads the flows API from Hubble Relay, plaintext gRPC on
    the pod port. Nothing else: no API server, no outside names.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flowscape
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: hubble-relay
      toPorts:
        - ports:
            - port: "4245"
              protocol: TCP
