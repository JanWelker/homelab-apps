---
# The same render as `make render`; scripts/render-charts.py says why it
# exists and why it is one parser rather than awk.
name: Render Charts
permissions:
  contents: read

"on":
  push:
    branches:
      - "main"
    paths:
      - "**/application.yaml"
  # No path filter on pull requests: this check is required by the ruleset
  # on main, and a required check that never reports leaves the pull
  # request waiting on it forever. It is seconds of work either way.
  pull_request:
  workflow_dispatch:

jobs:
  render:
    name: helm template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"

      - name: Install the project
        run: |
          uv python install
          uv sync --locked --dev

      - name: Render every chart-based Application
        run: uv run scripts/render-charts.py
