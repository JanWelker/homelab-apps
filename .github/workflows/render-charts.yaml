---
# There is no ArgoCD diff preview on this repository -- the tool renders the
# repository it is given, and it is pointed at the platform one. This is the
# cheap half of what it would have caught: a chart that refuses the values in
# an Application fails here rather than on the cluster.
name: Render Charts
permissions:
  contents: read

"on":
  push:
    branches:
      - "main"
    paths:
      - "**/application.yaml"
  pull_request:
    paths:
      - "**/application.yaml"
  workflow_dispatch:

jobs:
  render:
    name: helm template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # One parser, not two. Reading chart, repo, version and values out of the
      # YAML with awk looks simpler until a `- repoURL:` list item shifts the
      # fields by one and helm is handed the string "repoURL:" as a chart
      # repository -- which it resolves against a same-named directory in the
      # working tree and renders something that was never asked for.
      - name: Extract chart sources
        run: |
          python3 - <<'PY'
          import json, pathlib, yaml

          jobs = []
          for app in sorted(pathlib.Path(".").glob("*/application.yaml")):
              name = app.parent.name
              spec = yaml.safe_load(app.read_text())["spec"]
              charts = [s for s in (spec.get("sources") or [spec["source"]])
                        if "chart" in s]
              if not charts:
                  print(f"::notice title={name}::plain manifests, nothing to render")
                  continue
              for i, source in enumerate(charts):
                  values_file = f"/tmp/values-{name}-{i}.yaml"
                  values = source.get("helm", {}).get("valuesObject", {})
                  pathlib.Path(values_file).write_text(yaml.safe_dump(values))
                  jobs.append({
                      "name": name,
                      "chart": source["chart"],
                      "repo": source["repoURL"],
                      "version": source["targetRevision"],
                      "values": values_file,
                  })

          pathlib.Path("/tmp/jobs.json").write_text(json.dumps(jobs, indent=2))
          print(json.dumps(jobs, indent=2))
          PY

      - name: Render every chart-based Application
        run: |
          set -euo pipefail
          failed=0

          # From an empty directory: `helm template <name> <chart> --repo <url>`
          # prefers a local directory of that name over the repository, and
          # every chart here is named after a directory that exists.
          workdir="$(mktemp -d)"

          while read -r name chart repo version values; do
            echo "::group::$name ($chart $version from $repo)"
            if (cd "$workdir" && helm template "$name" "$chart" \
                 --repo "$repo" \
                 --version "$version" \
                 --namespace "$name" \
                 --values "$values" > /dev/null); then
              echo "ok"
            else
              echo "::error title=$name::helm template failed"
              failed=1
            fi
            echo "::endgroup::"
          done < <(python3 -c '
          import json
          for j in json.load(open("/tmp/jobs.json")):
              print(j["name"], j["chart"], j["repo"], j["version"], j["values"])
          ')

          exit "$failed"
