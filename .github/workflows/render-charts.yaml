---
# There is no ArgoCD diff preview on this repository -- the tool renders the
# repository it is given, and it is pointed at the platform one. This is the
# cheap half of what it would have caught: a chart that refuses the values in
# an Application fails here rather than on the cluster.
name: Render Charts
permissions:
  contents: read

"on":
  push:
    branches:
      - "main"
    paths:
      - "**/application.yaml"
  pull_request:
    paths:
      - "**/application.yaml"
  workflow_dispatch:

jobs:
  render:
    name: helm template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Render every chart-based Application
        run: |
          set -euo pipefail
          failed=0
          for app in */application.yaml; do
            name="$(dirname "$app")"

            # Applications built from plain manifests have no chart to render.
            if ! grep -q '^\s*chart:' "$app"; then
              echo "::notice title=$name::plain manifests, nothing to render"
              continue
            fi

            repo="$(awk '/repoURL:/{r=$2} /chart:/{print r; exit}' "$app")"
            chart="$(awk '/chart:/{print $2; exit}' "$app")"
            version="$(awk '/chart:/{f=1} f&&/targetRevision:/{print $2; exit}' "$app")"

            # The Application embeds its values under helm.valuesObject; lift
            # that subtree out so helm sees the same values ArgoCD will.
            python3 - "$app" > /tmp/values.yaml <<'PY'
          import sys, yaml
          app = yaml.safe_load(open(sys.argv[1]))
          sources = app["spec"].get("sources") or [app["spec"]["source"]]
          for s in sources:
              values = s.get("helm", {}).get("valuesObject")
              if values is not None:
                  yaml.safe_dump(values, sys.stdout)
                  break
          PY

            echo "::group::$name ($chart $version from $repo)"
            if helm template "$name" "$chart" \
                 --repo "$repo" \
                 --version "$version" \
                 --namespace "$name" \
                 --values /tmp/values.yaml > /dev/null; then
              echo "ok"
            else
              echo "::error title=$name::helm template failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
