---
name: Lint Markdown
permissions:
  contents: read

"on":
  push:
    branches:
      - "main"
    paths:
      - "**/*.md"
  # No path filter on pull requests: this check is required by the ruleset
  # on main, and a required check that never reports leaves the pull
  # request waiting on it forever. It is seconds of work either way.
  pull_request:
  workflow_dispatch:

jobs:
  markdown-lint:
    name: Markdown
    runs-on: ubuntu-latest
    container: node:24.22.0-alpine@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same version as .pre-commit-config.yaml, so a new rule cannot fail
      # main while the commit hook passes. Renovate moves both.
      - name: Install markdownlint-cli2
        env:
          # renovate: datasource=npm depName=markdownlint-cli2
          MARKDOWNLINT_CLI2_VERSION: "0.24.0"
        run: npm install -g "markdownlint-cli2@$MARKDOWNLINT_CLI2_VERSION"

      - name: Run markdownlint
        run: markdownlint-cli2 '**/*.md' '!**/.venv' '!site'
