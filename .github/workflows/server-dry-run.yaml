---
# Sends every rendered object to a kind cluster that holds the platform's
# CRDs, admission policies and namespaces from JanWelker/homelab at main, so
# a refusal fails the pull request instead of the sync, under the
# Application that renders the object. The scripts, kind, its node image and
# Helm are the platform's own; see CI workflows in the platform's
# docs/development/maintenance.md.
name: Server Dry Run
permissions:
  contents: read

"on":
  # No path filter on pull requests: ci-ok waits for every check, and a
  # platform change on homelab main can refuse a workload no file here
  # touched, so every pull request is judged against today's platform.
  pull_request:
  workflow_dispatch:

jobs:
  dry-run:
    name: kubectl apply --dry-run=server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: apps
          persist-credentials: false

      - name: Checkout the platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JanWelker/homelab
          ref: main
          path: homelab
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      # The platform's workflow pins them, with the node image at the nodes'
      # minor and a guard that holds it there; a second copy here would only
      # drift from the cluster.
      - name: Read the platform's pins
        id: pins
        run: |
          workflow=homelab/.github/workflows/server-dry-run.yaml
          for pin in KIND_VERSION KIND_NODE_IMAGE HELM_VERSION; do
            value=$(sed -n "s/^ *$pin: *//p" "$workflow")
            if [ -z "$value" ] || [ "$(printf '%s\n' "$value" | wc -l)" -ne 1 ]; then
              echo "::error::expected one $pin in $workflow"
              exit 1
            fi
            echo "$pin=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Install kind and Helm
        env:
          KIND_VERSION: ${{ steps.pins.outputs.KIND_VERSION }}
          HELM_VERSION: ${{ steps.pins.outputs.HELM_VERSION }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          kind=https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64
          curl -fsSLo kind-linux-amd64 "$kind"
          curl -fsSL "$kind.sha256sum" | sha256sum -c
          install -m 0755 kind-linux-amd64 kind
          helm=helm-$HELM_VERSION-linux-amd64.tar.gz
          curl -fsSLO "https://get.helm.sh/$helm"
          curl -fsSL "https://get.helm.sh/$helm.sha256sum" | sha256sum -c
          tar -xzf "$helm" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Start the cluster
        env:
          KIND_NODE_IMAGE: ${{ steps.pins.outputs.KIND_NODE_IMAGE }}
        run: |
          kind create cluster --name dry-run --image "$KIND_NODE_IMAGE" --wait 120s
          # kubectl at the API server's version, and the kustomize it embeds.
          docker cp dry-run-control-plane:/usr/bin/kubectl "$RUNNER_TEMP/bin/kubectl"

      - name: Render the platform
        run: >-
          uv run --project homelab --locked --no-dev python
          homelab/scripts/render-charts.py --out "$RUNNER_TEMP/platform"

      - name: Render
        id: render
        working-directory: apps
        run: |
          uv run --locked python scripts/render-charts.py --out "$RUNNER_TEMP/rendered"
          cp -R "$RUNNER_TEMP/rendered" "$RUNNER_TEMP/dry-run"
          uv run --locked python scripts/platform-prerequisites.py \
            "$RUNNER_TEMP/platform" "$RUNNER_TEMP/dry-run"

      - name: Conventions
        working-directory: apps
        run: uv run --locked pytest -q tests/test_conventions.py
        env:
          RENDERED_DIR: ${{ runner.temp }}/rendered
          PLATFORM_RENDERED_DIR: ${{ runner.temp }}/platform

      # Both report, whichever fails first.
      - name: Dry run
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        run: >-
          uv run --project homelab --locked --no-dev python
          homelab/scripts/server-dry-run.py "$RUNNER_TEMP/dry-run"
