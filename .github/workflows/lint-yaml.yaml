---
name: Lint YAML
permissions:
  contents: read

"on":
  push:
    branches:
      - "main"
    paths:
      - "**/*.yaml"
  # No path filter on pull requests: this check is required by the ruleset
  # on main, and a required check that never reports leaves the pull
  # request waiting on it forever. It is seconds of work either way.
  pull_request:
  workflow_dispatch:

jobs:
  yaml-lint:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"

      - name: Install the project
        run: |
          uv python install
          uv sync --locked --all-extras --dev

      - name: Run yamllint
        run: uv run yamllint -f github .
