---
name: Lint YAML
permissions:
  contents: read

"on":
  push:
    branches:
      - "main"
    paths:
      - "**/*.yaml"
  # No path filter on pull requests: this check is required by the ruleset
  # on main, and a required check that never reports leaves the pull
  # request waiting on it forever. It is seconds of work either way.
  pull_request:
  workflow_dispatch:

jobs:
  yaml-lint:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Install the project
        run: |
          uv python install
          uv sync --locked --all-extras --dev

      - name: Run yamllint
        run: uv run yamllint -f github .
