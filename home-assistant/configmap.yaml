---
# Read once at startup; restart the pod after a change. docs/home-assistant.md#usage
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
data:
  configuration.yaml: |
    default_config:

    homeassistant:
      name: Home
      external_url: "https://home.k8s.wlkr.ch"
      internal_url: "http://home-assistant.home-assistant.svc.cluster.local:8123"

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.244.0.0/16
      ip_ban_enabled: true
      login_attempts_threshold: 5

    recorder:
      db_url: !secret db_url
      purge_keep_days: 42
      auto_purge: true

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
