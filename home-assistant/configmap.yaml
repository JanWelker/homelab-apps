---
# Read once at startup; restart the pod after a change. docs/home-assistant.md#usage
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
data:
  configuration.yaml: |
    default_config:

    homeassistant:
      name: Home
      external_url: "https://home.k8s.wlkr.ch"
      internal_url: "http://home-assistant.home-assistant.svc.cluster.local:8123"

    frontend:
      extra_module_url:
        - /local/umami.js

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.244.0.0/16
      ip_ban_enabled: true
      login_attempts_threshold: 5

    recorder:
      db_url: !secret db_url
      purge_keep_days: 42
      auto_purge: true

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
  # Loaded through import(), which is not how the tracker expects to run, so
  # this module appends the real <script> tag. docs/umami.md#usage
  umami.js: |
    const s = document.createElement("script");
    s.defer = true;
    s.src = "https://analytics.k8s.wlkr.ch/script.js";
    s.dataset.websiteId = "afe34cd6-54d1-4ec4-93b1-cd873cdf6451";
    s.dataset.domains = "home.k8s.wlkr.ch";
    document.head.appendChild(s);
