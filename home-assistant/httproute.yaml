---
# authentik-server, not home-assistant: the outpost authenticates first.
# Pointing this at the app removes that layer. docs/home-assistant.md#configuration
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  parentRefs:
    - name: apps-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "home.k8s.wlkr.ch"
  rules:
    - backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
