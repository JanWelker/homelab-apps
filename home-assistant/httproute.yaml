---
# The backend is Authentik's embedded outpost, NOT home-assistant. Every
# request to this hostname is authenticated by Authentik before it reaches
# Home Assistant, which has no OIDC support of its own -- see
# https://janwelker.github.io/homelab/platform/authentik/#home-assistant-is-the-exception
#
# The cross-namespace backendRef is allowed only because
# payload/platform/authentik/referencegrant.yaml names this namespace. Pointing
# this at the home-assistant Service instead would silently remove the whole
# authentication layer, so it is worth a second look in review.
#
# external-dns still publishes the Route53 record from this route, and the
# apps-gateway wildcard still covers the name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  parentRefs:
    - name: apps-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "home.k8s.wlkr.ch"
  rules:
    - backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
