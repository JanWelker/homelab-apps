---
# external-dns publishes the Route53 record from this route, and the
# apps-gateway already holds a *.k8s.wlkr.ch certificate. Neither needs a
# resource here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  parentRefs:
    - name: apps-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "home.k8s.wlkr.ch"
  rules:
    - backendRefs:
        - name: home-assistant
          port: 8123
