---
# The workload owns its namespace so the Pod Security labels are declarative
# rather than whatever CreateNamespace=true happened to leave behind. An
# unlabelled namespace runs at `privileged`, which enforces nothing.
#
# baseline, not restricted: the Home Assistant image runs as root and the
# upstream project does not support running it otherwise.
apiVersion: v1
kind: Namespace
metadata:
  name: home-assistant
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    # Pruning a Namespace deletes the PVCs inside it. Never available by accident.
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-2"
