---
# /config: Home Assistant's own state -- the .storage registries that hold every
# device, entity, user and long-lived token. The recorder database is separate
# and in Postgres; this is the part that cannot be rebuilt from it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: home-assistant
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 5Gi
