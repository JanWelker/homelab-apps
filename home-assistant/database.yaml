---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: home-assistant-db
  namespace: home-assistant
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  # One instance: the -primary PDB would refuse every drain; see docs/conventions.md
  enablePDB: false

  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:6f187dfa49285b6d483524867be490bc935c0b2a6515c9bfb8578a6ab2e53bc6

  storage:
    size: 10Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: homeassistant
      owner: homeassistant

  postgresql:
    parameters:
      shared_buffers: 128MB
      max_connections: "50"

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

  monitoring:
    enablePodMonitor: true
