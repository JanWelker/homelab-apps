---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: home-assistant-db
  namespace: home-assistant
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  # No shutdown waits on the app's connection pool; see docs/conventions.md
  smartShutdownTimeout: 15
  # One instance: the -primary PDB would refuse every drain; see docs/conventions.md
  enablePDB: false

  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:1abcfd1cac6d53cda5185706819aab36d66a4ed88e99fc2ae44ab0826aa99f00

  storage:
    size: 10Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: homeassistant
      owner: homeassistant

  postgresql:
    parameters:
      shared_buffers: 128MB
      max_connections: "50"

  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: home-assistant-db
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: home-assistant-db-metrics
  namespace: home-assistant
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: home-assistant-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
