---
# Home Assistant's recorder, which is SQLite by default. SQLite on a network
# block device is the single most common cause of a slow Home Assistant, and
# this cluster has an operator for the alternative. See docs/conventions.md.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: home-assistant-db
  namespace: home-assistant
  annotations:
    # Deleting a Cluster deletes its PVCs. Never available by accident.
    argocd.argoproj.io/sync-options: Prune=false
    # Ahead of the Deployment: ArgoCD has a health check for this kind, so the
    # wave does not advance until Postgres reports "Cluster in healthy state".
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1

  # Renovate tracks this through the cnpg-image-name manager in renovate.json.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:fee233b6d388273e61313f93ac5bfb75449ecd6e107b804b19583526db0f5760

  storage:
    size: 10Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: homeassistant
      owner: homeassistant

  postgresql:
    parameters:
      # The recorder writes constantly and reads little, so Postgres's own
      # default of 128MB is plenty. Spelled out so the number is here rather
      # than implied, next to the memory limit it has to fit under.
      shared_buffers: 128MB
      max_connections: "50"

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

  monitoring:
    enablePodMonitor: true
