---
# Lands in the authentik namespace; the key must end in .yaml. docs/open-webui.md#oidc
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-open-webui
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  open-webui.yaml: |
    version: 1
    metadata:
      name: homelab-open-webui
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: open-webui-provider
        identifiers:
          name: open-webui
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          client_id: !Env OPEN_WEBUI_CLIENT_ID
          client_secret: !Env OPEN_WEBUI_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://chat.k8s.wlkr.ch/oauth/oidc/callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: open-webui
        attrs:
          name: Open WebUI
          provider: !KeyOf open-webui-provider
          meta_launch_url: https://chat.k8s.wlkr.ch
          meta_description: Chat with the models the household pays for
