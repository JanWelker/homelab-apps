---
# Seeded by `make bao-secrets` in the platform repository. docs/open-webui.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-config
  namespace: open-webui
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: open-webui-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: webui-secret-key
      remoteRef: {key: open-webui/config, property: webui-secret-key}
    - secretKey: openai-api-key
      remoteRef: {key: open-webui/config, property: openai-api-key}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-oidc
  namespace: open-webui
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: open-webui-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-id
      remoteRef: {key: open-webui/config, property: oidc-client-id}
    - secretKey: client-secret
      remoteRef: {key: open-webui/config, property: oidc-client-secret}
