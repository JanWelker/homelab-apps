---
# Generated by the PushSecret at the end of this file, except the OpenAI key,
# which `make bao-secrets` in the platform repository writes to its own path.
# docs/open-webui.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-config
  namespace: open-webui
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: open-webui-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: webui-secret-key
      remoteRef: {key: open-webui/config, property: webui-secret-key}
    - secretKey: openai-api-key
      remoteRef: {key: open-webui/openai, property: api-key}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-oidc
  namespace: open-webui
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: open-webui-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-id
      remoteRef: {key: open-webui/config, property: oidc-client-id}
    - secretKey: client-secret
      remoteRef: {key: open-webui/config, property: oidc-client-secret}
---
# Written once, never overwritten. The platform repository's
# docs/platform/openbao.md#generated-secrets
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: open-webui-config
  namespace: open-webui
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys:
    - webui-secret-key
    - oidc-client-id
    - oidc-client-secret
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: open-webui-config
  namespace: open-webui
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: open-webui-config
  data:
    - match: {secretKey: webui-secret-key, remoteRef: {remoteKey: open-webui/config, property: webui-secret-key}}
    - match: {secretKey: oidc-client-id, remoteRef: {remoteKey: open-webui/config, property: oidc-client-id}}
    - match: {secretKey: oidc-client-secret, remoteRef: {remoteKey: open-webui/config, property: oidc-client-secret}}
