---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: claude-virgil
  namespace: argocd
spec:
  project: apps
  sources:
    # An OCI chart, so its source has no directory to exclude application.yaml from.
    # Why each value is what it is: docs/claude-agents.md#configuration
    - repoURL: ghcr.io/janwelker/charts
      chart: agent-mooring
      targetRevision: 0.5.79
      helm:
        valuesObject:
          session: virgil
          repos:
            - JanWelker/virgil
          # The same skills as the laptop; see docs/claude-agents.md#configuration
          skills:
            repo: JanWelker/claude-skills
          kubernetes:
            access: none
          argocd:
            enabled: false
          # The session token lives at kv/claude-<session>/github; see docs/claude-agents.md#secrets
          secretStore:
            name: openbao-apps
            kind: ClusterSecretStore
          # Idle most of the time; see docs/claude-agents.md#configuration
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 4Gi
          ssh:
            authorizedKeys:
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIETuZF0g6gNIFXZbpaTokh3fm3MqqA68DjO+gSOMTDOW
    # The namespace's objects the chart does not render; see docs/claude-agents.md#configuration
    - repoURL: https://github.com/JanWelker/homelab-apps.git
      targetRevision: HEAD
      path: claude-virgil
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: claude-virgil
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
